<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenChronicle Atlas · Logo Concepts</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(1200px 700px at 50% -10%, #1d2430 0%, #0c0f14 55%, #07090c 100%);
    color: #e9e4da;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 56px 40px 64px;
  }
  header { text-align: center; margin-bottom: 40px; }
  h1 { margin: 0 0 10px; font-size: 28px; letter-spacing: .06em; font-weight: 600; }
  h1 span { color: #d7ab63; }
  .sub { margin: 0; font-size: 13px; color: #8d8a84; letter-spacing: .12em; }
  .grid { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .card {
    width: 292px;
    padding: 20px 20px 18px;
    border-radius: 28px;
    background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.015));
    border: 1px solid rgba(255,255,255,.07);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .icon { width: 230px; height: 230px; display: block; filter: drop-shadow(0 18px 40px rgba(0,0,0,.5)); }
  .name { margin: 20px 0 4px; font-size: 17px; font-weight: 600; letter-spacing: .04em; }
  .pick {
    display: inline-block;
    margin-left: 6px;
    padding: 3px 8px;
    font-size: 10px;
    letter-spacing: .08em;
    color: #0d0a08;
    background: linear-gradient(135deg, #f0cb8b, #d59a52);
    border-radius: 999px;
    font-weight: 700;
    vertical-align: 2px;
  }
  .desc { margin: 0 0 16px; font-size: 12.5px; color: #97938b; text-align: center; line-height: 1.6; }
  .swatches { display: flex; gap: 8px; }
  .sw { width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(255,255,255,.14); }
  .sizes { display: flex; align-items: flex-end; gap: 12px; margin-top: 18px; opacity: .95; }
  .sizes img { display: block; }
  footer { margin-top: 36px; font-size: 12px; color: #6d6a64; letter-spacing: .05em; }
</style>
</head>
<body>
  <header>
    <h1>OpenChronicle <span>Atlas</span> · Logo</h1>
    <p class="sub">史迹 · 时空地图　/　定稿 + 配色备选</p>
  </header>

  <main class="grid">
    <section class="card">
      <img class="icon" src="logo-openchronicle-atlas.svg" alt="Warm bronze colorway">
      <h2 class="name">青铜 · 朱砂<span class="pick">已定稿</span></h2>
      <p class="desc">深墨底 + 青铜金环 + 粗路线大路标<br>稳重、史书质感</p>
      <div class="swatches">
        <i class="sw" style="background:#17120e"></i>
        <i class="sw" style="background:#f0cb8b"></i>
        <i class="sw" style="background:#d59a52"></i>
        <i class="sw" style="background:#c34b29"></i>
      </div>
      <div class="sizes">
        <img src="logo-openchronicle-atlas.svg" width="64" height="64" alt="">
        <img src="logo-openchronicle-atlas.svg" width="32" height="32" alt="">
        <img src="logo-openchronicle-atlas.svg" width="16" height="16" alt="">
      </div>
    </section>

    <section class="card">
      <img class="icon" src="logo-openchronicle-atlas-v2.svg" alt="Jade colorway">
      <h2 class="name">青瓷 · 朱砂</h2>
      <p class="desc">青瓷绿环 + 暖金路标<br>博物馆气质，更清雅</p>
      <div class="swatches">
        <i class="sw" style="background:#0c1511"></i>
        <i class="sw" style="background:#acdcc7"></i>
        <i class="sw" style="background:#519c85"></i>
        <i class="sw" style="background:#c34b29"></i>
      </div>
      <div class="sizes">
        <img src="logo-openchronicle-atlas-v2.svg" width="64" height="64" alt="">
        <img src="logo-openchronicle-atlas-v2.svg" width="32" height="32" alt="">
        <img src="logo-openchronicle-atlas-v2.svg" width="16" height="16" alt="">
      </div>
    </section>

    <section class="card">
      <img class="icon" src="logo-openchronicle-atlas-v3.svg" alt="Indigo colorway">
      <h2 class="name">靛蓝 · 鎏金</h2>
      <p class="desc">延续 OpenReel 的蓝调 + 鎏金路标<br>家族感强，辨识度高</p>
      <div class="swatches">
        <i class="sw" style="background:#0c1320"></i>
        <i class="sw" style="background:#93b7f8"></i>
        <i class="sw" style="background:#507fe1"></i>
        <i class="sw" style="background:#efb268"></i>
      </div>
      <div class="sizes">
        <img src="logo-openchronicle-atlas-v3.svg" width="64" height="64" alt="">
        <img src="logo-openchronicle-atlas-v3.svg" width="32" height="32" alt="">
        <img src="logo-openchronicle-atlas-v3.svg" width="16" height="16" alt="">
      </div>
    </section>
  </main>

  <footer>中心符号：粗路线 + 大定位针　=　行程（地图）× 坐标（时间）　/　C 环 = Chronicle</footer>
</body>
</html>
