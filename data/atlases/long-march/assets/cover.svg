<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="长征 1934—1936 专题封面">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe6d4"/>
      <stop offset="0.55" stop-color="#e3d6bf"/>
      <stop offset="1" stop-color="#cdbb9d"/>
    </linearGradient>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#8b7355" opacity="0.12"/>
      <circle cx="4" cy="4" r="0.5" fill="#6b4f32" opacity="0.1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#paper)"/>
  <rect width="1200" height="675" fill="url(#grain)"/>

  <path d="M 120 520 C 260 470, 330 430, 420 455 S 560 520, 640 430 S 760 300, 860 330 S 980 250, 1080 190"
        fill="none" stroke="#8c2f24" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
  <path d="M 120 520 C 260 470, 330 430, 420 455 S 560 520, 640 430 S 760 300, 860 330 S 980 250, 1080 190"
        fill="none" stroke="#f3e9d6" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 14" opacity="0.9"/>

  <circle cx="120" cy="520" r="12" fill="#8c2f24"/>
  <circle cx="1080" cy="190" r="12" fill="#8c2f24"/>
  <circle cx="1080" cy="190" r="22" fill="none" stroke="#8c2f24" stroke-width="3" opacity="0.55"/>

  <text x="120" y="190" font-family="Songti SC, STSong, Noto Serif SC, serif" font-size="128" font-weight="700" fill="#2b2119" letter-spacing="16">长征</text>
  <text x="124" y="250" font-family="Songti SC, STSong, Noto Serif SC, serif" font-size="34" fill="#6b4f32" letter-spacing="6">1934 — 1936</text>
  <text x="124" y="300" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="20" fill="#7a6248" letter-spacing="2">史迹 · 时空地图　OpenChronicle Atlas</text>

  <g opacity="0.5">
    <line x1="120" y1="610" x2="1080" y2="610" stroke="#8b7355" stroke-width="1"/>
    <text x="120" y="640" font-family="PingFang SC, sans-serif" font-size="16" fill="#7a6248">示意图 · 数据待史料校订</text>
  </g>
</svg>
