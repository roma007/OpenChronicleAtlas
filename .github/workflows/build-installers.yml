name: Build installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*-m*'

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-secrets:
    name: Check signing secrets
    runs-on: ubuntu-latest
    outputs:
      apple: ${{ steps.check.outputs.apple }}
      android: ${{ steps.check.outputs.android }}
    steps:
      - id: check
        env:
          APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$APPLE_CERT" ] && [ -n "$APPLE_PROFILE" ]; then
            echo "apple=true" >> "$GITHUB_OUTPUT"
          else
            echo "apple=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$ANDROID_KEYSTORE" ]; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi

  web:
    name: Web / PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        env:
          VITE_AMAP_KEY: ${{ secrets.VITE_AMAP_KEY }}
          VITE_AMAP_SECURITY_CODE: ${{ secrets.VITE_AMAP_SECURITY_CODE }}
          VITE_SHARE_BASE_URL: ${{ vars.SHARE_BASE_URL }}
        run: pnpm build

      - name: Zip web build
        run: cd apps/web && zip -r "$RUNNER_TEMP/atlas-web.zip" dist

      - uses: actions/upload-artifact@v4
        with:
          name: atlas-web
          path: ${{ runner.temp }}/atlas-web.zip
          retention-days: 30
          if-no-files-found: error

  desktop-macos:
    name: macOS (${{ matrix.target }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact: atlas-macos-arm64
          - target: x86_64-apple-darwin
            artifact: atlas-macos-x64
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS bundles
        env:
          VITE_AMAP_KEY: ${{ secrets.VITE_AMAP_KEY }}
          VITE_AMAP_SECURITY_CODE: ${{ secrets.VITE_AMAP_SECURITY_CODE }}
          VITE_AMAP_DESKTOP_KEY: ${{ secrets.VITE_AMAP_DESKTOP_KEY }}
          VITE_AMAP_DESKTOP_SECURITY_CODE: ${{ secrets.VITE_AMAP_DESKTOP_SECURITY_CODE }}
          VITE_SHARE_BASE_URL: ${{ vars.SHARE_BASE_URL }}
        run: pnpm --filter @atlas/desktop exec tauri build --target ${{ matrix.target }} --bundles app,dmg

      - name: Archive .app
        run: |
          cd "apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          tar -czf "$RUNNER_TEMP/atlas-macos-${{ matrix.target }}.app.tar.gz" "史迹.app"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            ${{ runner.temp }}/atlas-macos-${{ matrix.target }}.app.tar.gz
          retention-days: 30
          if-no-files-found: error

  desktop-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows bundles
        env:
          VITE_AMAP_KEY: ${{ secrets.VITE_AMAP_KEY }}
          VITE_AMAP_SECURITY_CODE: ${{ secrets.VITE_AMAP_SECURITY_CODE }}
          VITE_AMAP_DESKTOP_KEY: ${{ secrets.VITE_AMAP_DESKTOP_KEY }}
          VITE_AMAP_DESKTOP_SECURITY_CODE: ${{ secrets.VITE_AMAP_DESKTOP_SECURITY_CODE }}
          VITE_SHARE_BASE_URL: ${{ vars.SHARE_BASE_URL }}
        run: pnpm --filter @atlas/desktop exec tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: atlas-windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
          if-no-files-found: error

  android:
    name: Android
    needs: check-secrets
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_AMAP_ANDROID_KEY: ${{ secrets.EXPO_PUBLIC_AMAP_ANDROID_KEY }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prebuild Android
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare release signing
        if: needs.check-secrets.outputs.android == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/atlas-release.keystore"
          mkdir -p "$HOME/.openchronicle"
          cat > "$HOME/.openchronicle/atlas-keystore.properties" <<EOF
          storeFile=$RUNNER_TEMP/atlas-release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          node apps/mobile/scripts/configure-android-release.mjs

      - name: Build signed AAB and APK
        if: needs.check-secrets.outputs.android == 'true'
        working-directory: apps/mobile/android
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: atlas-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: needs.check-secrets.outputs.android == 'true'
        with:
          name: atlas-android-release
          path: |
            apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error

  ios:
    name: iOS (signed IPA)
    needs: check-secrets
    if: needs.check-secrets.outputs.apple == 'true'
    runs-on: macos-15
    env:
      LANG: en_US.UTF-8
      EXPO_PUBLIC_AMAP_IOS_KEY: ${{ secrets.EXPO_PUBLIC_AMAP_IOS_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      APPLE_PROVISIONING_PROFILE_NAME: ${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Import signing certificate and profile
        run: |
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          EXISTING_KEYCHAINS=()
          while IFS= read -r keychain; do
            EXISTING_KEYCHAINS+=("$keychain")
          done < <(security list-keychains -d user | tr -d '"')
          security list-keychains -d user -s build.keychain "${EXISTING_KEYCHAINS[@]}"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > "$PROFILE_DIR/atlas.mobileprovision"

      - name: Prebuild iOS
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install

      - name: Archive
        working-directory: apps/mobile/ios
        run: |
          xcodebuild \
            -workspace app.xcworkspace \
            -scheme app \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/Atlas.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$APPLE_PROVISIONING_PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            archive

      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.openchronicle.atlas</key>
              <string>$APPLE_PROVISIONING_PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Atlas.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - uses: actions/upload-artifact@v4
        with:
          name: atlas-ios
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/Atlas.xcarchive/dSYMs/*.dSYM
          retention-days: 30
          if-no-files-found: error

  release:
    name: GitHub Release (tags)
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.web.result == 'success' }}
    needs: [web, desktop-macos, desktop-windows, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: List artifacts
        run: find dist-artifacts -type f -maxdepth 4 -print

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-artifacts/**/*.zip
            dist-artifacts/**/*.dmg
            dist-artifacts/**/*.tar.gz
            dist-artifacts/**/*.msi
            dist-artifacts/**/*.exe
            dist-artifacts/**/*.apk
            dist-artifacts/**/*.aab
            dist-artifacts/**/*.ipa
