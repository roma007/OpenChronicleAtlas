[package]
name = "openchronicle-atlas-desktop"
version = "1.0.6"
description = "史迹 · 时空地图桌面端"
authors = ["OpenChronicle Atlas"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "atlas_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
